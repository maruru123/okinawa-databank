name: collect

# watch = 台風の予報・警報の発表/解除。事後に取り直せないので15分ごとに見張る。
#         GitHub のスケジュール実行はベストエフォートで、実測では約2/3が発火しなかった
#         （2026-07-28: 30分間隔の設定で実効87分間隔。09:45の台風発表を取り逃がした）。
#         15分間隔にしてスキップを吸収する。public リポなので Actions は無制限。
#         重複排除は issue / reportDatetime で行うため、頻度を上げても保存量は増えない。
# daily = アメダスの実績。気象庁が約8日間は遡及配信しているので1日1回で足りる。
# 注意: スケジュール実行はデフォルトブランチのワークフローしか動かない。
on:
  schedule:
    - cron: '*/15 * * * *'  # 15分ごと（実際の発火はGitHub次第。スキップ前提の設定）
    - cron: '10 15 * * *'   # JST 00:10 → 前日分の実績を確定値で取る
  workflow_dispatch:
    inputs:
      mode:
        description: 収集モード
        type: choice
        options: [watch, daily]
        default: watch

permissions:
  contents: write

# 毎時と日次が重なっても push が競合しないよう直列化する
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: モードを決める
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "10 15 * * *" ]; then
              echo "mode=daily" >> "$GITHUB_OUTPUT"
            else
              echo "mode=watch" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      # 取得失敗しても欠測レコードは JSONL に書かれている。まずコミットしてから落とす。
      - name: 収集
        id: collect
        continue-on-error: true
        run: node scripts/collect.mjs ${{ steps.mode.outputs.mode }}

      - name: コミットして push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # daily が初回実行のときは state/ がまだ無いことがあるので個別に足す
          git add -A data || true
          git add -A state || true
          if git diff --cached --quiet; then
            echo "追記なし（警報・台風に変化がなければ通常のこと）"
            exit 0
          fi
          # TZ=Asia/Tokyo に頼らない（tzdata の有無で静かに UTC に落ちる環境がある）。
          # データ側と同じ「UTC+9時間して getUTC* で読む」方式で揃える。
          STAMP=$(node -e "const d=new Date(Date.now()+9*36e5),p=n=>String(n).padStart(2,'0');console.log(d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+' JST')")
          git commit -m "data: ${{ steps.mode.outputs.mode }} collect ${STAMP} [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 競合。rebase して再試行 (${attempt}/3)"
            git pull --rebase --autostash
          done
          echo "3回試しても push できなかった" >&2
          exit 1

      - name: 取得失敗があったのでジョブを失敗させる
        if: steps.collect.outcome == 'failure'
        run: |
          echo "取得に失敗したソースがあります。欠測レコードは記録済みです。" >&2
          echo "ログの「取得に失敗しました」の行を確認してください。" >&2
          exit 1
